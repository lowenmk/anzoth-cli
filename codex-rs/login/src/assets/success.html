<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signed in to Anzoth</title>
    <meta name="theme-color" content="#03050A" />
    <link rel="icon" href="__ANZOTH_FAVICON_DATA_URI__" type="image/png" />
    <style>
      :root {
        --bg: #03050a;
        --surface: rgba(10, 13, 20, 0.88);
        --surface-2: rgba(13, 17, 32, 0.92);
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(116, 138, 255, 0.24);
        --text-primary: #f4f7ff;
        --text-secondary: rgba(244, 247, 255, 0.66);
        --accent-blue: #5ea3ff;
        --accent-purple: #bb5cff;
        --success: #5ef0ad;
        --shadow: 0 24px 72px rgba(0, 0, 0, 0.42);
        --font-sans: "SF Pro", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text-primary);
        background:
          radial-gradient(circle at top, rgba(78, 92, 255, 0.16), transparent 34%),
          radial-gradient(circle at 18% 18%, rgba(187, 92, 255, 0.12), transparent 26%),
          radial-gradient(circle at 82% 70%, rgba(94, 163, 255, 0.08), transparent 24%),
          var(--bg);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .panel {
        width: min(100%, 620px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }

      .brand {
        width: min(100%, 320px);
        display: block;
      }

      .card {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(13, 17, 32, 0.92), rgba(8, 10, 17, 0.96)),
          var(--surface);
        box-shadow: var(--shadow);
        padding: 40px 36px 34px;
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, rgba(94, 163, 255, 0.18), rgba(187, 92, 255, 0.14));
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      .status {
        width: 68px;
        height: 68px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background:
          linear-gradient(180deg, rgba(94, 163, 255, 0.18), rgba(187, 92, 255, 0.18)),
          rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(120, 143, 255, 0.3);
        box-shadow: 0 0 0 8px rgba(94, 163, 255, 0.04);
      }

      .status svg {
        width: 30px;
        height: 30px;
        color: var(--success);
      }

      h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(2rem, 3.2vw, 3rem);
        line-height: 1.06;
        font-weight: 650;
        letter-spacing: -0.045em;
      }

      .supporting {
        margin: 16px auto 0;
        max-width: 52ch;
        text-align: center;
        color: var(--text-secondary);
        font-size: clamp(1rem, 1.8vw, 1.1rem);
        line-height: 1.6;
        letter-spacing: -0.01em;
      }

      .supporting strong {
        color: var(--text-primary);
        font-weight: 650;
      }

      @media (max-width: 640px) {
        .shell {
          padding: 24px 16px;
        }

        .panel {
          gap: 18px;
        }

        .brand {
          width: min(100%, 260px);
        }

        .card {
          padding: 30px 20px 26px;
          border-radius: 24px;
        }

        .status {
          width: 60px;
          height: 60px;
          margin-bottom: 14px;
        }

        h1 {
          font-size: clamp(1.7rem, 8vw, 2.3rem);
        }

        .supporting {
          margin-top: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-labelledby="success-heading">
      <section class="panel">
        <img class="brand" src="__ANZOTH_LOGO_DATA_URI__" alt="Anzoth" />
        <div class="card" role="status" aria-live="polite">
          <div class="status" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M8 16.5L13.4 22L24 10"
                stroke="currentColor"
                stroke-width="2.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <h1 id="success-heading">Signed in to Anzoth</h1>
          <p class="supporting">You can close this window and return to the Anzoth CLI.</p>
        </div>
      </section>
    </main>
    <script>
      window.history.replaceState(null, "", "/success");
    </script>
  </body>
</html>
